# Render-Blueprint: ZWEI Dienste, damit das Spiel sofort lädt und der Server nur bei einem Online-Spiel aufwachen muss.
#  1) hitisop               = das Spiel (Static Site, schläft nie) -> Adresse bleibt https://hitisop.onrender.com
#  2) hitisop-online-server = Online-Server (WebSocket, Gratis-Instanz schläft) -> wird erst beim Start eines Online-Spiels geweckt (bis ~1 min, das Spiel zeigt eine Wartemeldung). Diese Adresse tippst du nie selbst ein.
# Einrichten: Render -> New -> Blueprint -> dieses Repo wählen (vorher den alten Dienst "hitisop" löschen, damit die Adresse frei wird).
# Wenn Render dem Server eine andere Adresse gibt (steht im Dashboard beim Dienst), nur die Zeile HITISOP_ONLINE_URL unten anpassen.
services:
  - type: web
    runtime: static
    name: hitisop
    buildCommand: node tools/build.mjs
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
    envVars:
      - key: HITISOP_ONLINE_URL
        value: https://hitisop-online-server.onrender.com
  - type: web
    name: hitisop-online-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev && node tools/build.mjs
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
