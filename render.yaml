# Render-Blueprint: ein Web Service liefert das Spiel UND den Online-Server (WebSocket). Render -> New -> Blueprint -> dieses Repo wählen, fertig.
services:
  - type: web
    name: hitisop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev && node tools/build.mjs
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
